<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiwiCayAndLinks</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --border: #1a1a1a; --accent: #fff; --text-main: #fff; --text-dim: #888; }
        body { background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; margin: 0; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -1px; }
        .nav { display: flex; gap: 20px; }
        .nav-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .nav-btn.active { color: var(--accent); }
        
        .auth-group { display: flex; gap: 10px; }
        .btn-white { background: #fff; color: #000; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: none; border: 1px solid #333; color: #fff; padding: 8px 18px; border-radius: 6px; cursor: pointer; }

        .hero { padding: 60px 40px 20px; max-width: 1200px; margin: 0 auto; }
        .hero h1 { font-size: 4rem; font-weight: 800; line-height: 0.9; margin: 0; letter-spacing: -3px; }
        .hero h1 span { color: #222; }

        .admin-box { background: #050505; border: 1px solid #222; padding: 25px; border-radius: 12px; max-width: 600px; margin: 20px auto; display: none; }
        input, textarea { background: #111; border: 1px solid #333; color: #fff; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; position: relative; }
        .card h3 { margin: 0 0 10px; font-size: 1.4rem; }
        .card p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 15px; }
        .copy-btn { width: 100%; background: #222; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

        #bot-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        #bot-window { position: absolute; bottom: 60px; right: 0; width: 280px; background: #fff; color: #000; border-radius: 12px; padding: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<header>
    <div class="logo">kiwicayandlinks</div>
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('news', this)">новости</button>
        <button class="nav-btn" onclick="switchTab('keys', this)">vpn ключи</button>
        <button class="nav-btn" onclick="switchTab('links', this)">игры</button>
    </div>
    <div class="auth-group">
        <button class="btn-outline" id="reg-btn" onclick="register()">Регистрация</button>
        <button class="btn-white" id="login-btn" onclick="login()">Войти</button>
    </div>
</header>

<div class="hero">
    <h1 id="title-main">Новости<br><span>проекта.</span></h1>
</div>

<div class="admin-box" id="admin-ui">
    <h3 style="margin:0 0 15px">Панель админа</h3>
    <div id="admin-fields"></div>
    <button class="btn-white" style="width:100%" onclick="publish()">Опубликовать</button>
</div>

<div class="grid" id="content-grid"></div>

<div id="bot-wrap">
    <div id="bot-window">
        <strong>Алексей</strong>
        <p id="bot-msg" style="font-size:0.8rem">Привет! Нужна помощь?</p>
        <input type="text" id="bot-in" placeholder="Вопрос..." style="background:#f0f0f0; color:#000; padding:5px">
        <button class="btn-white" style="width:100%; padding:5px" onclick="askBot()">Спросить</button>
    </div>
    <button class="btn-white" onclick="toggleBot()">Алексей</button>
</div>

<script>
    const client = new Appwrite.Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('6a060e85002b596f5eb8');
    const db = new Appwrite.Databases(client);
    const acc = new Appwrite.Account(client);
    const DB_ID = '6a060ed50024663c678c';
    let currentTab = 'news';
    let isAdmin = false;

    // РЕГИСТРАЦИЯ
    async function register() {
        const nick = prompt("Придумайте ник:");
        const pass = prompt("Придумайте пароль (мин. 8 симв.):");
        if(nick && pass) {
            try {
                await acc.create('unique()', `${nick}@a.com`, pass, nick);
                alert("Успех! Теперь нажмите 'Войти'");
            } catch (e) { alert("Ошибка: " + e.message); }
        }
    }

    // ВХОД
    async function login() {
        if (isAdmin) { await acc.deleteSession('current'); location.reload(); return; }
        const nick = prompt("Ник:");
        const pass = prompt("Пароль:");
        if (nick && pass) {
            try {
                await acc.createEmailSession(`${nick}@a.com`, pass);
                checkAdmin();
            } catch (e) { alert("Неверные данные!"); }
        }
    }

    async function checkAdmin() {
        try {
            const user = await acc.get();
            if (user.name === 'adm') {
                isAdmin = true;
                document.getElementById('login-ui').style.display = 'none'; // Условно
                document.getElementById('admin-ui').style.display = 'block';
                document.getElementById('login-btn').innerText = "Выйти";
                document.getElementById('reg-btn').style.display = "none";
            }
        } catch (e) {}
        switchTab('news', document.querySelector('.nav-btn'));
    }

    async function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const titles = { 'news': 'Новости<br><span>проекта.</span>', 'keys': 'VPN Ключи<br><span>бесплатно.</span>', 'links': 'Игры<br><span>скачать.</span>' };
        document.getElementById('title-main').innerHTML = titles[tab];

        const fields = document.getElementById('admin-fields');
        if (tab === 'news') fields.innerHTML = '<textarea id="v1" placeholder="Текст новости..."></textarea>';
        if (tab === 'keys') fields.innerHTML = '<input id="v1" placeholder="Название (н-р: WireGuard)"><input id="v2" placeholder="Описание (н-р: Германия)"><input id="v3" placeholder="САМ КЛЮЧ (код)">';
        if (tab === 'links') fields.innerHTML = '<input id="v1" placeholder="Игра"><input id="v2" placeholder="Инфо"><input id="v3" placeholder="Ссылка">';
        loadData();
    }

    async function loadData() {
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<p>Загрузка...</p>';
        try {
            const res = await db.listDocuments(DB_ID, currentTab);
            grid.innerHTML = res.documents.map(d => `
                <div class="card">
                    <h3>${d.content || d.title || d.game_name}</h3>
                    <p>${d.description || ''}</p>
                    ${currentTab === 'keys' ? `<button class="copy-btn" onclick="navigator.clipboard.writeText('${d.url || ''}'); alert('Ключ скопирован!')">СКОПИРОВАТЬ КЛЮЧ</button>` : ''}
                    ${d.url && currentTab === 'links' ? `<a href="${d.url}" target="_blank" class="btn-white" style="text-decoration:none; display:block; text-align:center">СКАЧАТЬ</a>` : ''}
                    ${isAdmin ? `<button onclick="drop('${d.$id}')" style="color:red; background:none; border:none; margin-top:10px; cursor:pointer">Удалить</button>` : ''}
                </div>
            `).join('');
        } catch (e) { grid.innerHTML = '<p>Пусто</p>'; }
    }

    async function publish() {
        const data = {};
        if (currentTab === 'news') data.content = document.getElementById('v1').value;
        if (currentTab === 'keys') { data.title = document.getElementById('v1').value; data.description = document.getElementById('v2').value; data.url = document.getElementById('v3').value; }
        if (currentTab === 'links') { data.game_name = document.getElementById('v1').value; data.description = document.getElementById('v2').value; data.url = document.getElementById('v3').value; }
        await db.createDocument(DB_ID, currentTab, 'unique()', data);
        loadData();
    }

    async function drop(id) { if (confirm("Удалить?")) { await db.deleteDocument(DB_ID, currentTab, id); loadData(); } }
    function toggleBot() { const w = document.getElementById('bot-window'); w.style.display = w.style.display === 'block' ? 'none' : 'block'; }
    function askBot() { alert("Алексей: Я пока обрабатываю данные..."); }

    checkAdmin();
</script>
</body>
</html>
