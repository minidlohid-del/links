<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiwiCayAndLinks</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --border: #1a1a1a; --accent: #fff; --text-main: #fff; --text-dim: #888; }
        body { background: var(--bg); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* ШАПКА */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -1px; text-transform: lowercase; }
        .nav { display: flex; gap: 20px; }
        .nav-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; transition: 0.3s; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { color: var(--accent); }
        .auth-btn { background: var(--accent); color: #000; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        /* ГЛАВНЫЙ ЗАГОЛОВОК */
        .hero { padding: 80px 40px 40px; max-width: 1200px; margin: 0 auto; }
        .hero h1 { font-size: 4.5rem; font-weight: 800; line-height: 0.9; margin: 0; letter-spacing: -3px; }
        .hero h1 span { color: #222; }

        /* КОНТЕНТ */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; transition: 0.3s; }
        .card:hover { border-color: #444; }
        .card h3 { margin: 0 0 10px; font-size: 1.5rem; letter-spacing: -0.5px; }
        .card p { color: var(--text-dim); line-height: 1.5; margin-bottom: 20px; font-size: 0.95rem; }
        .card a { display: inline-block; background: #fff; color: #000; text-decoration: none; font-weight: 700; padding: 10px 20px; border-radius: 6px; font-size: 0.8rem; }

        /* АДМИНКА */
        .admin-box { background: #050505; border: 1px solid #222; padding: 30px; border-radius: 12px; max-width: 600px; margin: 20px auto; display: none; }
        input, textarea { background: #111; border: 1px solid #333; color: #fff; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
        .save-btn { background: #fff; color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }

        /* БОТ АЛЕКСЕЙ */
        #bot-wrap { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        #bot-trigger { background: var(--accent); color: #000; padding: 12px 24px; border-radius: 50px; cursor: pointer; font-weight: 700; }
        #bot-window { position: absolute; bottom: 70px; right: 0; width: 300px; background: #fff; color: #000; border-radius: 16px; padding: 20px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        #bot-window h4 { margin: 0 0 10px; font-size: 1.1rem; }
        #bot-msg { font-size: 0.9rem; margin-bottom: 15px; }
        .bot-input-group { display: flex; gap: 5px; }
        .bot-input-group input { background: #f0f0f0; border: none; color: #000; padding: 8px; margin: 0; }
    </style>
</head>
<body>

<header>
    <div class="logo">kiwicayandlinks</div>
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('news', this)">новости</button>
        <button class="nav-btn" onclick="switchTab('keys', this)">vpn ключи</button>
        <button class="nav-btn" onclick="switchTab('links', this)">игры</button>
    </div>
    <button class="auth-btn" id="login-btn" onclick="login()">Войти</button>
</header>

<div class="hero">
    <h1 id="title-main">Новости<br><span>проекта.</span></h1>
</div>

<div class="admin-box" id="admin-ui">
    <h3 style="margin-top:0">Создать запись</h3>
    <div id="admin-fields"></div>
    <button class="save-btn" onclick="publish()">Опубликовать</button>
</div>

<div class="grid" id="content-grid"></div>

<div id="bot-wrap">
    <div id="bot-window">
        <h4>Бот Алексей</h4>
        <p id="bot-msg">Привет! Чем могу помочь?</p>
        <div class="bot-input-group">
            <input type="text" id="bot-in" placeholder="Ваш вопрос...">
            <button class="auth-btn" style="padding:5px 15px" onclick="askBot()">➜</button>
        </div>
    </div>
    <div id="bot-trigger" onclick="toggleBot()">Алексей</div>
</div>

<script>
    const client = new Appwrite.Client()
        .setEndpoint('https://cloud.appwrite.io/v1')
        .setProject('6a060e85002b596f5eb8');

    const db = new Appwrite.Databases(client);
    const acc = new Appwrite.Account(client);

    const DB_ID = '6a060ed50024663c678c';
    let currentTab = 'news';
    let isAdmin = false;

    // Вход
    async function login() {
        if (isAdmin) { await acc.deleteSession('current'); location.reload(); return; }
        const nick = prompt("Ник:");
        const pass = prompt("Пароль:");
        if (nick === 'adm' && pass === 'loh_7766') {
            try {
                await acc.createEmailSession('adm@a.com', 'loh_7766');
                checkAdmin();
            } catch (e) { alert("Ошибка входа!"); }
        }
    }

    async function checkAdmin() {
        try {
            const user = await acc.get();
            if (user.name === 'adm' || user.$id === 'adm') {
                isAdmin = true;
                document.getElementById('login-btn').innerText = "Выйти";
                document.getElementById('admin-ui').style.display = 'block';
            }
        } catch (e) {}
        switchTab('news', document.querySelector('.nav-btn'));
    }

    // Переключение вкладок
    async function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const titles = { 'news': 'Новости<br><span>проекта.</span>', 'keys': 'VPN Ключи<br><span>бесплатно.</span>', 'links': 'Игры<br><span>скачать.</span>' };
        document.getElementById('title-main').innerHTML = titles[tab];

        const fields = document.getElementById('admin-fields');
        if (tab === 'news') fields.innerHTML = '<textarea id="val1" placeholder="Текст новости..."></textarea>';
        if (tab === 'keys') fields.innerHTML = '<input id="val1" placeholder="Заголовок"><input id="val2" placeholder="Описание">';
        if (tab === 'links') fields.innerHTML = '<input id="val1" placeholder="Игра"><input id="val2" placeholder="Инфо"><input id="val3" placeholder="Ссылка">';

        loadData();
    }

    // Загрузка
    async function loadData() {
        const grid = document.getElementById('content-grid');
        grid.innerHTML = '<p>Загрузка...</p>';
        try {
            const res = await db.listDocuments(DB_ID, currentTab);
            grid.innerHTML = res.documents.map(d => `
                <div class="card">
                    <h3>${d.content || d.title || d.game_name}</h3>
                    <p>${d.description || ''}</p>
                    ${d.url ? `<a href="${d.url}" target="_blank">СКАЧАТЬ</a>` : ''}
                    ${isAdmin ? `<br><button onclick="drop('${d.$id}')" style="color:red; background:none; border:none; margin-top:15px; cursor:pointer;">[Удалить]</button>` : ''}
                </div>
            `).join('');
        } catch (e) { grid.innerHTML = '<p>Данных пока нет.</p>'; }
    }

    // Сохранение
    async function publish() {
        const data = {};
        if (currentTab === 'news') data.content = document.getElementById('val1').value;
        if (currentTab === 'keys') { data.title = document.getElementById('val1').value; data.description = document.getElementById('val2').value; }
        if (currentTab === 'links') { data.game_name = document.getElementById('val1').value; data.description = document.getElementById('val2').value; data.url = document.getElementById('val3').value; }
        
        try {
            await db.createDocument(DB_ID, currentTab, 'unique()', data);
            loadData();
        } catch (e) { alert("Ошибка сохранения!"); }
    }

    async function drop(id) { if (confirm("Удалить?")) { await db.deleteDocument(DB_ID, currentTab, id); loadData(); } }

    // Бот
    function toggleBot() { const w = document.getElementById('bot-window'); w.style.display = w.style.display === 'block' ? 'none' : 'block'; }
    function askBot() {
        const i = document.getElementById('bot-in').value.toLowerCase();
        const m = document.getElementById('bot-msg');
        if (i.includes('vpn')) m.innerText = "Ключи ищи в разделе 'VPN Ключи'.";
        else if (i.includes('игра')) m.innerText = "Игры доступны в разделе 'Игры'.";
        else m.innerText = "Я Алексей, и я помогу тебе во всем разобраться!";
        document.getElementById('bot-in').value = '';
    }

    checkAdmin();
</script>
</body>
</html>
