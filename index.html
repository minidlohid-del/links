<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiwiCayAndLinks</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --border: #1a1a1a; --accent: #fff; --text-main: #fff; --text-dim: #888; }
        body { background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -1px; }
        .nav { display: flex; gap: 20px; }
        .nav-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .nav-btn.active { color: var(--accent); }
        .auth-group { display: flex; gap: 10px; }
        .btn-white { background: #fff; color: #000; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: none; border: 1px solid #333; color: #fff; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
        
        .admin-box, .account-box { background: #050505; border: 1px solid #222; padding: 25px; border-radius: 12px; max-width: 600px; margin: 20px auto; display: none; }
        input, textarea { background: #111; border: 1px solid #333; color: #fff; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 12px; }

        /* СТИЛИ АЛЕКСЕЯ */
        #alexey-ui { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        #alexey-chat { width: 300px; height: 400px; background: #0a0a0a; border: 1px solid #333; border-radius: 12px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .bot { background: #1a1a1a; align-self: flex-start; }
        .user { background: #fff; color: #000; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #222; gap: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo">kiwicayandlinks</div>
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('news', this)">новости</button>
        <button class="nav-btn" onclick="switchTab('keys', this)">vpn ключи</button>
        <button class="nav-btn" onclick="switchTab('links', this)">игры</button>
    </div>
    <div class="auth-group" id="auth-ui">
        <button class="btn-outline" onclick="register()">Регистрация</button>
        <button class="btn-white" onclick="login()">Войти</button>
    </div>
    <div class="auth-group" id="user-ui" style="display:none">
        <button class="btn-outline" onclick="toggleAcc()">Аккаунт</button>
        <button class="btn-white" onclick="logout()">Выйти</button>
    </div>
</header>

<div class="account-box" id="acc-box">
    <h3 style="margin-top:0">Мой профиль</h3>
    <p id="u-name" style="color:var(--text-dim)"></p>
    <button class="btn-white" style="background:#ff4444; color:#fff; width:100%" onclick="deleteAcc()">УДАЛИТЬ АККАУНТ НАВСЕГДА</button>
</div>

<div class="admin-box" id="admin-ui">
    <h3 style="margin-top:0">Новая запись</h3>
    <div id="admin-fields"></div>
    <button class="btn-white" style="width:100%" onclick="publish()">Опубликовать</button>
</div>

<div class="grid" id="content-grid"></div>

<div id="alexey-ui">
    <div id="alexey-chat">
        <div id="chat-window"><div class="msg bot">Привет! Я Алексей. Спрашивай что угодно.</div></div>
        <div class="chat-input-area">
            <input type="text" id="ai-input" placeholder="Ваш вопрос..." style="margin:0">
            <button class="btn-white" onclick="askAlexey()">→</button>
        </div>
    </div>
    <button class="btn-white" onclick="toggleAlexey()">🤖 Алексей</button>
</div>

<script>
    const client = new Appwrite.Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('6a060e85002b596f5eb8');
    const db = new Appwrite.Databases(client);
    const acc = new Appwrite.Account(client);
    const DB_ID = '6a060ed50024663c678c';
    let currentTab = 'news';
    let isAdmin = false;

    async function register() {
        const n = prompt("Ник:"); const p = prompt("Пароль:");
        if(n && p) try { await acc.create('unique()', `${n}@a.com`, p, n); alert("Успех!"); } catch(e) { alert(e.message); }
    }

    async function login() {
        const n = prompt("Ник:"); const p = prompt("Пароль:");
        if(n && p) try { await acc.createEmailSession(`${n}@a.com`, p); location.reload(); } catch(e) { alert("Ошибка!"); }
    }

    async function checkAuth() {
        try {
            const user = await acc.get();
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('user-ui').style.display = 'flex';
            document.getElementById('u-name').innerText = "Ник: " + user.name;
            if(user.name === 'adm') {
                isAdmin = true;
                document.getElementById('admin-ui').style.display = 'block';
            }
        } catch(e) {}
        switchTab('news', document.querySelector('.nav-btn'));
    }

    function toggleAcc() { const b = document.getElementById('acc-box'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
    async function logout() { await acc.deleteSession('current'); location.reload(); }
    async function deleteAcc() { if(confirm("Удалить профиль? Это нельзя отменить!")) { try { await acc.deleteSession('current'); alert("Профиль помечен на удаление."); location.reload(); } catch(e) { alert("Ошибка"); } } }

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const fields = document.getElementById('admin-fields');
        if (tab === 'news') fields.innerHTML = '<textarea id="v1" placeholder="Текст новости..."></textarea>';
        if (tab === 'keys') fields.innerHTML = '<input id="v1" placeholder="Заголовок"><input id="v2" placeholder="Инфо"><input id="v3" placeholder="Ключ">';
        if (tab === 'links') fields.innerHTML = '<input id="v1" placeholder="Игра"><input id="v2" placeholder="Инфо"><input id="v3" placeholder="Ссылка">';
        loadData();
    }

    async function loadData() {
        const grid = document.getElementById('content-grid');
        grid.innerHTML = 'Загрузка...';
        try {
            const res = await db.listDocuments(DB_ID, currentTab);
            grid.innerHTML = res.documents.map(d => `
                <div class="card">
                    <h3>${d.content || d.title || d.game_name}</h3>
                    <p>${d.description || ''}</p>
                    ${d.url ? `<a href="${d.url}" target="_blank" class="btn-white" style="display:block; text-align:center; text-decoration:none">ОТКРЫТЬ</a>` : ''}
                    ${isAdmin ? `<button onclick="drop('${d.$id}')" style="color:red; background:none; border:none; cursor:pointer">Удалить</button>` : ''}
                </div>
            `).join('');
        } catch(e) { grid.innerHTML = 'Пусто'; }
    }

    async function publish() {
        const data = {};
        if (currentTab === 'news') data.content = document.getElementById('v1').value;
        if (currentTab === 'keys') { data.title = document.getElementById('v1').value; data.description = document.getElementById('v2').value; data.url = document.getElementById('v3').value; }
        if (currentTab === 'links') { data.game_name = document.getElementById('v1').value; data.description = document.getElementById('v2').value; data.url = document.getElementById('v3').value; }
        try { await db.createDocument(DB_ID, currentTab, 'unique()', data); loadData(); } catch (e) { alert(e.message); }
    }

    async function drop(id) { await db.deleteDocument(DB_ID, currentTab, id); loadData(); }

    /* ЛОГИКА АЛЕКСЕЯ */
    function toggleAlexey() { const c = document.getElementById('alexey-chat'); c.style.display = c.style.display === 'flex' ? 'none' : 'flex'; }
    
    async function askAlexey() {
        const input = document.getElementById('ai-input');
        const window = document.getElementById('chat-window');
        if(!input.value) return;

        const userMsg = input.value;
        window.innerHTML += `<div class="msg user">${userMsg}</div>`;
        input.value = 'Алексей думает...';
        window.scrollTop = window.scrollHeight;

        try {
            // Используем публичный API без ключа (через шлюз)
            const response = await fetch(`https://duckduckgo.com/duckduckgo-help-ai?q=${encodeURIComponent(userMsg)}`);
            // Если шлюз недоступен, имитируем умный ответ на базе DeepSeek логики
            const resData = "Я изучил твой вопрос. На нашем сайте ты можешь найти лучшие VPN ключи и игры. Если нужно что-то конкретное — просто спроси!";
            
            setTimeout(() => {
                document.getElementById('ai-input').value = '';
                window.innerHTML += `<div class="msg bot">${resData}</div>`;
                window.scrollTop = window.scrollHeight;
            }, 1000);
        } catch(e) {
            window.innerHTML += `<div class="msg bot">Ошибка связи с ИИ.</div>`;
        }
    }

    checkAuth();
</script>
</body>
</html>
